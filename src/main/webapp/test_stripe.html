
<!DOCTYPE html>

    <script>
        const publicKey = 'pk_test_51SvdNtB6fcOdgfGCSGw1RLi6eGacqlbUDbkICIWr9VdL2xDAp4r5aBuLHxOHi3NnkwfPfGgHYgAmylwgKKjYdaCe00LQnCpNxFF';
        
        try {

            const elements = stripe.elements({
